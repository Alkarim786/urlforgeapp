version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urlforge_app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - APP_NAME=URLForge
      - APP_URL=http://localhost:8000
      - DATABASE_URL=postgresql+asyncpg://urlforge_user:urlforge_password@postgres:5432/urlforge_db
      - REDIS_URL=redis://redis:6379/0
      - CACHE_TTL_SECONDS=86400
      - RATE_LIMIT_PER_MINUTE=100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - urlforge_network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: urlforge_postgres
    environment:
      POSTGRES_USER: urlforge_user
      POSTGRES_PASSWORD: urlforge_password
      POSTGRES_DB: urlforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlforge_user -d urlforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - urlforge_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: urlforge_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - urlforge_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  urlforge_network:
    driver: bridge
